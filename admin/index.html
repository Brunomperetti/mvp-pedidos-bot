<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Productos</title>
    <style>
        body { font-family: Arial; background: #f2f2f2; margin: 0; padding: 0; }
        h1 { background: #333; color: white; padding: 20px; margin: 0; }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
        th { background: #ddd; }
        .form-box { background: white; padding: 20px; border-radius: 6px; margin-top: 30px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; }
        button { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

<h1>Panel Administrador de Productos</h1>

<div class="container">

    <h2>📦 Lista de Productos</h2>
    <table id="tablaProductos">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock Color</th>
                <th>Editar</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="form-box">
        <h2>➕ Crear Producto</h2>
        <input id="new_codigo" placeholder="Código">
        <input id="new_nombre" placeholder="Nombre">
        <input id="new_precio" placeholder="Precio" type="number">
        <select id="new_stock">
            <option value="verde">Verde</option>
            <option value="amarillo">Amarillo</option>
            <option value="rojo">Rojo</option>
        </select>
        <button onclick="crearProducto()">Crear Producto</button>
    </div>

    <div class="form-box">
        <h2>✏️ Editar Producto</h2>
        <input id="edit_codigo" placeholder="Código (no editable)" disabled>
        <input id="edit_nombre" placeholder="Nombre">
        <input id="edit_precio" placeholder="Precio" type="number">
        <select id="edit_stock">
            <option value="verde">Verde</option>
            <option value="amarillo">Amarillo</option>
            <option value="rojo">Rojo</option>
        </select>
        <button onclick="guardarCambios()">Guardar Cambios</button>
    </div>

</div>

<script>
const API = ""; // Render automáticamente apunta al mismo dominio

// Cargar productos al iniciar
document.addEventListener("DOMContentLoaded", cargarProductos);

async function cargarProductos() {
    const res = await fetch("/productos");
    const productos = await res.json();

    const tbody = document.querySelector("#tablaProductos tbody");
    tbody.innerHTML = "";

    productos.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${p.codigo}</td>
            <td>${p.nombre}</td>
            <td>$${p.precio}</td>
            <td>${p.stock_color}</td>
            <td><button onclick='editar(${JSON.stringify(p)})'>Editar</button></td>
        `;
        tbody.appendChild(tr);
    });
}

function editar(p) {
    document.getElementById("edit_codigo").value = p.codigo;
    document.getElementById("edit_nombre").value = p.nombre;
    document.getElementById("edit_precio").value = p.precio;
    document.getElementById("edit_stock").value = p.stock_color;
}

async function crearProducto() {
    const data = {
        codigo: document.getElementById("new_codigo").value,
        nombre: document.getElementById("new_nombre").value,
        precio: document.getElementById("new_precio").value,
        stock_color: document.getElementById("new_stock").value
    };

    await fetch("/crear_producto", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

    alert("Producto creado!");
    cargarProductos();
}

async function guardarCambios() {
    const data = {
        codigo: document.getElementById("edit_codigo").value,
        nombre: document.getElementById("edit_nombre").value,
        precio: document.getElementById("edit_precio").value,
        stock_color: document.getElementById("edit_stock").value
    };

    await fetch("/actualizar_producto", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

    alert("Producto actualizado!");
    cargarProductos();
}
</script>

</body>
</html>
