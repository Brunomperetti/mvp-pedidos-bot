<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Catálogo</title>

    <!-- BOOTSTRAP 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .card {
            border-radius: 12px;
        }
        .table td, .table th {
            vertical-align: middle;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Panel Administrador</span>
    </div>
</nav>

<div class="container">

    <!-- LISTA DE PRODUCTOS -->
    <div class="card p-4 mb-4">
        <h4 class="mb-3">Lista de Productos</h4>

        <table class="table table-striped" id="tablaProductos">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <!-- Los productos se cargan con JS -->
            </tbody>
        </table>
    </div>

    <!-- AGREGAR NUEVO PRODUCTO -->
    <div class="card p-4">
        <h4 class="mb-3">Agregar nuevo producto</h4>

        <form id="formNuevo" class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Código</label>
                <input type="text" id="newCodigo" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Nombre</label>
                <input type="text" id="newNombre" class="form-control" required>
            </div>

            <div class="col-md-2">
                <label class="form-label">Precio</label>
                <input type="number" id="newPrecio" class="form-control" required>
            </div>

            <div class="col-md-2">
                <label class="form-label">Stock</label>
                <select id="newStock" class="form-select">
                    <option value="verde">Verde</option>
                    <option value="amarillo">Amarillo</option>
                    <option value="rojo">Rojo</option>
                </select>
            </div>

            <div class="col-md-1 d-flex align-items-end">
                <button type="button" class="btn btn-success w-100" onclick="crearProducto()">
                    Agregar
                </button>
            </div>
        </form>
    </div>

    <!-- MODAL EDITAR PRODUCTO -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="formEditar">

                        <div class="mb-3">
                            <label class="form-label">Código</label>
                            <input type="text" id="editCodigo" class="form-control" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="editNombre" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Precio</label>
                            <input type="number" id="editPrecio" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Stock</label>
                            <select id="editStock" class="form-select">
                                <option value="verde">Verde</option>
                                <option value="amarillo">Amarillo</option>
                                <option value="rojo">Rojo</option>
                            </select>
                        </div>

                    </form>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="guardarCambios()">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- BOOTSTRAP + JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

    let productos = [];
    let modal;

    document.addEventListener("DOMContentLoaded", () => {
        modal = new bootstrap.Modal(document.getElementById("modalEditar"));
        cargarProductos();
    });

    // Cargar productos desde la API
    async function cargarProductos() {
        const res = await fetch("http://127.0.0.1:8000/productos");
        productos = await res.json();

        let tbody = document.querySelector("#tablaProductos tbody");
        tbody.innerHTML = "";

        productos.forEach(p => {
            let tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${p.codigo}</td>
                <td>${p.nombre}</td>
                <td>$${p.precio}</td>
                <td>${p.stock_color.toUpperCase()}</td>
                <td>
                    <button class="btn btn-sm btn-primary" onclick="editar('${p.codigo}')">
                        Editar
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
        });
    }

    // Abrir modal con info para editar
    function editar(codigo) {
        const p = productos.find(x => x.codigo === codigo);

        document.getElementById("editCodigo").value = p.codigo;
        document.getElementById("editNombre").value = p.nombre;
        document.getElementById("editPrecio").value = p.precio;
        document.getElementById("editStock").value = p.stock_color;

        modal.show();
    }

    // Guardar cambios de edición
    async function guardarCambios() {
        let data = {
            codigo: document.getElementById("editCodigo").value,
            nombre: document.getElementById("editNombre").value,
            precio: document.getElementById("editPrecio").value,
            stock_color: document.getElementById("editStock").value
        };

        await fetch("http://127.0.0.1:8000/actualizar_producto", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        modal.hide();
        cargarProductos();
    }

    // Crear nuevo producto
    async function crearProducto() {
        let data = {
            codigo: document.getElementById("newCodigo").value,
            nombre: document.getElementById("newNombre").value,
            precio: document.getElementById("newPrecio").value,
            stock_color: document.getElementById("newStock").value
        };

        // Validación mínima: código y nombre obligatorios
        if (!data.codigo || !data.nombre) {
            alert("Código y nombre son obligatorios.");
            return;
        }

        await fetch("http://127.0.0.1:8000/crear_producto", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        // Limpiar formulario
        document.getElementById("formNuevo").reset();
        document.getElementById("newStock").value = "verde";

        // Recargar tabla
        cargarProductos();
    }

</script>

</body>
</html>
